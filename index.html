<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiches — TCF Vocabulaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14181a;
    --bg-2: #1b2124;
    --paper: #f3ecd8;
    --paper-2: #eae1c8;
    --ink: #232017;
    --ink-soft: #5c5646;
    --gold: #c79a3d;
    --gold-soft: #e0bd6f;
    --sapphire: #3a6ea5;
    --wine: #93433f;
    --sage: #4c7a5d;
    --line: rgba(243,236,216,0.14);
    --radius: 10px;
    --shadow: 0 18px 40px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 20% -10%, #1e262a 0%, var(--bg) 55%);
    color: var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px;}

  /* Header */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:32px;margin:2px 0 0;letter-spacing:-.01em;}
  .brand h1 em{font-style:italic;color:var(--gold-soft);}
  nav.tabs{display:flex;gap:6px;}
  nav.tabs button{
    background:transparent;border:1px solid var(--line);color:var(--paper);
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;
    padding:8px 14px;border-radius:999px;cursor:pointer;transition:.15s;text-transform:uppercase;
  }
  nav.tabs button:hover{border-color:var(--gold-soft);}
  nav.tabs button.active{background:var(--gold-soft);color:#1a1608;border-color:var(--gold-soft);font-weight:600;}

  /* Dashboard */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  .stat-card{
    background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;position:relative;overflow:hidden;
  }
  .stat-card .n{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;}
  .stat-card .l{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px;display:block;}
  .stat-card.total{border-color:var(--gold-soft);}
  .stat-card.total .n{color:var(--gold-soft);}
  .stat-card.review .n{color:#c9c3ab;}
  .stat-card.learning .n{color:var(--gold-soft);}
  .stat-card.learnt .n{color:#7fbd94;}

  .progress-outer{height:8px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;margin-bottom:30px;}
  .progress-inner{height:100%;background:linear-gradient(90deg,var(--sage),var(--gold-soft));width:0%;transition:width .4s ease;}

  .section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 12px;}

  .start-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px;}
  select, .btn{
    font-family:'Inter',sans-serif;font-size:14px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--paper);padding:10px 14px;
  }
  select{min-width:200px;}
  .btn{cursor:pointer;font-weight:600;transition:.15s;}
  .btn.primary{background:var(--gold-soft);color:#1a1608;border-color:var(--gold-soft);}
  .btn.primary:hover{background:var(--gold);}
  .btn.ghost:hover{border-color:var(--gold-soft);}

  .cat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:6px;}
  .cat-chip{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer;
    background:var(--bg-2);
  }
  .cat-chip:hover{border-color:var(--gold-soft);}
  .cat-chip .cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}

  /* Study view */
  .study-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
  .deck-pos{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}

  .card-stage{display:flex;justify-content:center;margin:18px 0 22px;perspective:1600px;}
  .card{
    width:100%;max-width:520px;height:320px;position:relative;cursor:pointer;
    transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;
    background:var(--paper);color:var(--ink);box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:36px 30px;text-align:center;border:1px solid var(--paper-2);
  }
  .face::before{
    content:'';position:absolute;left:26px;top:0;bottom:0;width:1px;background:rgba(147,67,63,.28);
  }
  .face .hole{position:absolute;left:26px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 2px 4px rgba(0,0,0,.4);}
  .face .tag{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--wine);background:rgba(147,67,63,.09);border:1px solid rgba(147,67,63,.25);
    padding:4px 10px;border-radius:999px;margin-bottom:18px;
  }
  .face .word{font-family:'Fraunces',serif;font-weight:600;font-size:34px;line-height:1.15;}
  .face .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:14px;letter-spacing:.04em;}
  .face.back{transform:rotateY(180deg);background:var(--paper-2);}
  .face.back .word.fr-recap{
    font-size:17px;font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--ink-soft);
    letter-spacing:.03em;margin-bottom:16px;
  }
  .face.back .meaning{font-family:'Fraunces',serif;font-weight:600;font-size:32px;line-height:1.2;color:var(--sapphire);}

  .hint{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:22px;letter-spacing:.05em;}

  .mark-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
  .mark-btn{
    flex:1;min-width:150px;max-width:220px;padding:14px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--paper);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s;
  }
  .mark-btn small{font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:10px;color:var(--ink-soft);}
  .mark-btn.review:hover{border-color:#c9c3ab;}
  .mark-btn.learning:hover{border-color:var(--gold-soft);}
  .mark-btn.learnt:hover{border-color:var(--sage);}

  .nav-row{display:flex;justify-content:center;gap:14px;margin-top:8px;}
  .nav-row button{background:transparent;border:none;color:var(--ink-soft);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;text-decoration:underline;}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* Browse */
  .browse-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  input[type=text]{
    font-family:'Inter',sans-serif;font-size:14px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--paper);flex:1;min-width:180px;
  }
  table.browse{width:100%;border-collapse:collapse;font-size:14px;}
  table.browse th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 6px;}
  table.browse td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.browse td.fr{font-weight:600;}
  table.browse td.cat{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);white-space:nowrap;}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .status-dot.review{background:#c9c3ab;}
  .status-dot.learning{background:var(--gold-soft);}
  .status-dot.learnt{background:var(--sage);}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{
    border:1px solid var(--line);background:transparent;color:var(--paper);border-radius:6px;padding:4px 8px;
    font-size:11px;cursor:pointer;
  }
  .row-actions button.active-r{background:#c9c3ab;color:#1a1608;border-color:#c9c3ab;}
  .row-actions button.active-l{background:var(--gold-soft);color:#1a1608;border-color:var(--gold-soft);}
  .row-actions button.active-k{background:var(--sage);color:#0c1a10;border-color:var(--sage);}
  .pager{display:flex;justify-content:center;gap:10px;margin:18px 0;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .pager button{background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:6px;padding:6px 12px;cursor:pointer;}

  footer.app-footer{margin-top:40px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  footer.app-footer button{background:none;border:none;color:var(--wine);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:inherit;}

  @media (max-width:600px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .card{height:280px;}
    .face .word{font-size:26px;}
  }
</style>
</head>

<script>
const STORAGE_KEY = 'tcf_flash_progress_v1';
let progress = { status: {} }; // id -> 'learning' | 'learnt'  (absent = review)
let currentView = 'home';
let studyDeck = []; // array of ids
let studyPos = 0;
let studyFilterBucket = 'review';
let studyFilterCat = 'all';
let browsePage = 0;
const PAGE_SIZE = 40;
let browseFilterBucket = 'all';
let browseFilterCat = 'all';
let browseSearch = '';

const root = document.getElementById('view-root');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getStatus(id){ return progress.status[id] || 'review'; }

function counts(){
  let review=0, learning=0, learnt=0;
  for(let i=0;i<DATA.length;i++){
    const s = getStatus(i);
    if(s==='learning') learning++;
    else if(s==='learnt') learnt++;
    else review++;
  }
  return {review, learning, learnt, total: DATA.length};
}

function categoryList(){
  const map = {};
  DATA.forEach(d=>{ map[d.c] = (map[d.c]||0)+1; });
  return Object.entries(map).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
}

function loadProgress(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      progress = JSON.parse(saved);
      if(!progress.status) progress.status = {};
    }
  }catch(e){ /* no saved progress yet */ }
  render();
}

let saveTimer = null;
function saveProgress(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
    catch(e){ console.error('save failed', e); }
  }, 250);
}

function setStatus(id, status){
  if(status==='review') delete progress.status[id];
  else progress.status[id] = status;
  saveProgress();
}

/* ---------- HOME ---------- */
function renderHome(){
  const c = counts();
  const pct = c.total ? Math.round((c.learnt/c.total)*100) : 0;
  const cats = categoryList();
  root.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card total"><span class="n">${c.total}</span><span class="l">Total des mots</span></div>
      <div class="stat-card review"><span class="n">${c.review}</span><span class="l">Under review</span></div>
      <div class="stat-card learning"><span class="n">${c.learning}</span><span class="l">Still learning</span></div>
      <div class="stat-card learnt"><span class="n">${c.learnt}</span><span class="l">Learnt</span></div>
    </div>
    <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
    <p class="section-title">Start a session</p>
    <div class="start-row">
      <select id="homeBucket">
        <option value="review">Under review (new + not mastered)</option>
        <option value="learning">Still learning</option>
        <option value="learnt">Already learnt (review)</option>
        <option value="all">All words</option>
      </select>
      <select id="homeCat">
        <option value="all">All categories</option>
        ${cats.map(([name,n])=>`<option value="${escapeAttr(name)}">${escapeHtml(name)} (${n})</option>`).join('')}
      </select>
      <button class="btn primary" id="startStudyBtn">Start flashcards →</button>
    </div>
    <p class="section-title">Categories (${cats.length})</p>
    <div class="cat-list">
      ${cats.slice(0,24).map(([name,n])=>`<div class="cat-chip" data-cat="${escapeAttr(name)}"><span>${escapeHtml(name)}</span><span class="cnt">${n}</span></div>`).join('')}
    </div>
  `;
  document.getElementById('startStudyBtn').onclick = ()=>{
    studyFilterBucket = document.getElementById('homeBucket').value;
    studyFilterCat = document.getElementById('homeCat').value;
    startStudy();
  };
  root.querySelectorAll('.cat-chip').forEach(el=>{
    el.onclick = ()=>{
      studyFilterBucket = 'all';
      studyFilterCat = el.getAttribute('data-cat');
      startStudy();
    };
  });
}

/* ---------- STUDY ---------- */
function buildDeck(bucket, cat){
  let ids = [];
  for(let i=0;i<DATA.length;i++){
    if(cat!=='all' && DATA[i].c!==cat) continue;
    const s = getStatus(i);
    if(bucket!=='all' && s!==bucket) continue;
    ids.push(i);
  }
  return shuffle(ids);
}

function startStudy(){
  studyDeck = buildDeck(studyFilterBucket, studyFilterCat);
  studyPos = 0;
  setView('study');
}

function renderStudy(){
  if(studyDeck.length===0){
    root.innerHTML = `
      <div class="study-bar">
        <span class="deck-pos">0 / 0</span>
      </div>
      <div class="empty">No words in this selection. Choose a different filter from the dashboard.</div>
      <div class="nav-row"><button id="backHome">← back to dashboard</button></div>
    `;
    document.getElementById('backHome').onclick = ()=> setView('home');
    return;
  }
  if(studyPos >= studyDeck.length) studyPos = 0;
  const id = studyDeck[studyPos];
  const item = DATA[id];
  const s = getStatus(id);
  root.innerHTML = `
    <div class="study-bar">
      <select id="studyBucketSel">
        <option value="review" ${studyFilterBucket==='review'?'selected':''}>Under review</option>
        <option value="learning" ${studyFilterBucket==='learning'?'selected':''}>Still learning</option>
        <option value="learnt" ${studyFilterBucket==='learnt'?'selected':''}>Learnt</option>
        <option value="all" ${studyFilterBucket==='all'?'selected':''}>Tous</option>
      </select>
      <span class="deck-pos">${studyPos+1} / ${studyDeck.length}</span>
      <button class="btn ghost" id="shuffleBtn">shuffle ↻</button>
    </div>
    <div class="card-stage">
      <div class="card" id="flashcard">
        <div class="face front">
          <div class="hole"></div>
          <span class="tag">${escapeHtml(item.c)}</span>
          <div class="word">${escapeHtml(item.f)}</div>
          <div class="sub">click to reveal</div>
        </div>
        <div class="face back">
          <div class="hole"></div>
          <div class="word fr-recap">${escapeHtml(item.f)}</div>
          <div class="meaning">${escapeHtml(item.e)}</div>
        </div>
      </div>
    </div>
    <div class="hint">space to flip · 1 under review · 2 still learning · 3 learnt</div>
    <div class="mark-row">
      <button class="mark-btn review" data-s="review"><span>Under review</span><small>key 1</small></button>
      <button class="mark-btn learning" data-s="learning"><span>Still learning</span><small>key 2</small></button>
      <button class="mark-btn learnt" data-s="learnt"><span>Learnt ✓</span><small>key 3</small></button>
    </div>
    <div class="nav-row">
      <button id="prevCard">← previous</button>
      <button id="backHome2">dashboard</button>
      <button id="nextCard">next →</button>
    </div>
  `;
  const cardEl = document.getElementById('flashcard');
  let flipped = false;
  cardEl.onclick = ()=>{ flipped=!flipped; cardEl.classList.toggle('flipped', flipped); };
  root.querySelectorAll('.mark-btn').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      setStatus(id, b.getAttribute('data-s'));
      advanceCard();
    };
  });
  document.getElementById('nextCard').onclick = advanceCard;
  document.getElementById('prevCard').onclick = ()=>{
    studyPos = (studyPos-1+studyDeck.length)%studyDeck.length;
    renderStudy();
  };
  document.getElementById('backHome2').onclick = ()=> setView('home');
  document.getElementById('shuffleBtn').onclick = ()=>{
    studyDeck = shuffle(studyDeck); studyPos=0; renderStudy();
  };
  document.getElementById('studyBucketSel').onchange = (e)=>{
    studyFilterBucket = e.target.value;
    startStudy();
  };
}

function advanceCard(){
  // if bucket filter excludes current status now, deck composition may change on rebuild; simplest: move to next, rebuild deck lazily at end
  studyPos++;
  if(studyPos >= studyDeck.length){
    studyDeck = buildDeck(studyFilterBucket, studyFilterCat);
    studyPos = 0;
  }
  renderStudy();
}

document.addEventListener('keydown', (e)=>{
  if(currentView!=='study') return;
  if(e.code==='Space'){ e.preventDefault(); const c=document.getElementById('flashcard'); if(c) c.click(); }
  if(e.key==='1'||e.key==='2'||e.key==='3'){
    const map={'1':'review','2':'learning','3':'learnt'};
    if(studyDeck.length){
      setStatus(studyDeck[studyPos], map[e.key]);
      advanceCard();
    }
  }
  if(e.key==='ArrowRight'){ advanceCard(); }
  if(e.key==='ArrowLeft'){
    if(studyDeck.length){ studyPos=(studyPos-1+studyDeck.length)%studyDeck.length; renderStudy(); }
  }
});

/* ---------- BROWSE ---------- */
function renderBrowse(){
  const cats = categoryList();
  let ids = [];
  for(let i=0;i<DATA.length;i++){
    if(browseFilterCat!=='all' && DATA[i].c!==browseFilterCat) continue;
    const s = getStatus(i);
    if(browseFilterBucket!=='all' && s!==browseFilterBucket) continue;
    if(browseSearch){
      const q = browseSearch.toLowerCase();
      if(!DATA[i].f.toLowerCase().includes(q) && !DATA[i].e.toLowerCase().includes(q)) continue;
    }
    ids.push(i);
  }
  const totalPages = Math.max(1, Math.ceil(ids.length/PAGE_SIZE));
  if(browsePage >= totalPages) browsePage = totalPages-1;
  const pageIds = ids.slice(browsePage*PAGE_SIZE, browsePage*PAGE_SIZE+PAGE_SIZE);

  root.innerHTML = `
    <div class="browse-controls">
      <input type="text" id="searchBox" placeholder="Search a word (French or English)…" value="${escapeAttr(browseSearch)}">
      <select id="browseBucketSel">
        <option value="all" ${browseFilterBucket==='all'?'selected':''}>All statuses</option>
        <option value="review" ${browseFilterBucket==='review'?'selected':''}>Under review</option>
        <option value="learning" ${browseFilterBucket==='learning'?'selected':''}>Still learning</option>
        <option value="learnt" ${browseFilterBucket==='learnt'?'selected':''}>Learnt</option>
      </select>
      <select id="browseCatSel">
        <option value="all">All categories</option>
        ${cats.map(([name,n])=>`<option value="${escapeAttr(name)}" ${browseFilterCat===name?'selected':''}>${escapeHtml(name)} (${n})</option>`).join('')}
      </select>
    </div>
    <p class="section-title">${ids.length} word(s) found</p>
    <table class="browse">
      <thead><tr><th style="width:26px"></th><th>French</th><th>English</th><th>Category</th><th>Status</th></tr></thead>
      <tbody>
        ${pageIds.map(id=>{
          const it = DATA[id]; const s = getStatus(id);
          return `<tr>
            <td><span class="status-dot ${s}"></span></td>
            <td class="fr">${escapeHtml(it.f)}</td>
            <td>${escapeHtml(it.e)}</td>
            <td class="cat">${escapeHtml(it.c)}</td>
            <td>
              <div class="row-actions">
                <button data-id="${id}" data-s="review" class="${s==='review'?'active-r':''}">Review</button>
                <button data-id="${id}" data-s="learning" class="${s==='learning'?'active-l':''}">Learning</button>
                <button data-id="${id}" data-s="learnt" class="${s==='learnt'?'active-k':''}">Learnt</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="pager">
      <button id="pgPrev" ${browsePage===0?'disabled':''}>← previous</button>
      <span>page ${browsePage+1} / ${totalPages}</span>
      <button id="pgNext" ${browsePage>=totalPages-1?'disabled':''}>next →</button>
    </div>
  `;
  document.getElementById('searchBox').oninput = (e)=>{ browseSearch=e.target.value; browsePage=0; renderBrowse(); };
  document.getElementById('browseBucketSel').onchange = (e)=>{ browseFilterBucket=e.target.value; browsePage=0; renderBrowse(); };
  document.getElementById('browseCatSel').onchange = (e)=>{ browseFilterCat=e.target.value; browsePage=0; renderBrowse(); };
  document.getElementById('pgPrev').onclick = ()=>{ browsePage=Math.max(0,browsePage-1); renderBrowse(); };
  document.getElementById('pgNext').onclick = ()=>{ browsePage=Math.min(totalPages-1,browsePage+1); renderBrowse(); };
  root.querySelectorAll('.row-actions button').forEach(b=>{
    b.onclick = ()=>{
      setStatus(parseInt(b.getAttribute('data-id')), b.getAttribute('data-s'));
      renderBrowse();
    };
  });
}

/* ---------- shared ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function setView(v){
  currentView = v;
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-view')===v);
  });
  render();
}

function render(){
  if(currentView==='home') renderHome();
  else if(currentView==='study') renderStudy();
  else if(currentView==='browse') renderBrowse();
}

document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick = ()=> setView(b.getAttribute('data-view'));
});
document.getElementById('resetBtn').onclick = async ()=>{
  if(confirm('Reset all progress? This action cannot be undone.')){
    progress = { status: {} };
    saveProgress();
    render();
  }
};

loadProgress();
</script>
</body>
